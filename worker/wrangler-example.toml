name = "kakiokosu-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "your-firebase-project-id"
# Set DEEPGRAM_API_KEY and ADMIN_USER_ID via `wrangler secret put`

[[d1_databases]]
binding = "DB"
database_name = "kakiokosu-db"
database_id = "local-d1-placeholder"
migrations_dir = "migrations"

[triggers]
crons = ["0 3 * * *"]

